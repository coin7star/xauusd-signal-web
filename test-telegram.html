<!DOCTYPE html>
<html>
<head>
  <title>Test Telegram</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; padding: 20px; background: #0a0a0f; color: #fff; }
    button { background: #7c6cf5; color: white; border: none; padding: 14px 24px; border-radius: 10px; font-size: 16px; width: 100%; margin-top: 10px; cursor: pointer; }
    #result { margin-top: 20px; padding: 14px; background: #13132a; border-radius: 10px; font-size: 13px; word-break: break-all; min-height: 50px; }
  </style>
</head>
<body>
  <h2>🔔 Test Telegram Notif</h2>
  <button onclick="testBuy()">Test Sinyal BUY 🟢</button>
  <button onclick="testSell()">Test Sinyal SELL 🔴</button>
  <div id="result">Hasil akan muncul di sini...</div>

  <script>
    async function sendTest(signal) {
      document.getElementById('result').textContent = 'Mengirim...';
      try {
        const res = await fetch('/api/notify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            signal,
            price: 2387.45,
            reason: 'Test notifikasi XAUAI. EMA golden cross terkonfirmasi, momentum bullish.',
            confidence: 85
          })
        });
        const data = await res.json();
        document.getElementById('result').textContent = JSON.stringify(data, null, 2);
      } catch(e) {
        document.getElementById('result').textContent = 'Error: ' + e.message;
      }
    }

    function testBuy()  { sendTest('BUY'); }
    function testSell() { sendTest('SELL'); }
  </script>
</body>
</html>
